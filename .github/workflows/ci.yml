name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (stress-index math)
        run: npm test

      - name: Production build
        run: npm run build

  streamlit:
    name: Streamlit — headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: streamlit_app/requirements.txt

      - name: Install dependencies
        run: pip install -r streamlit_app/requirements.txt

      - name: Smoke test (boots app.py, visits every page)
        run: python streamlit_app/smoke_test.py
